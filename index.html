<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a2e">
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a1020;
  --surface: #131e35;
  --surface2: #1d2a44;
  --border: #2a3a5a;
  --text: #e5e9f2;
  --text2: #8a9ab5;
  --accent: #3b5dc9;       /* navy */
  --accent2: #5577e0;
  --accent-soft: #1d2c4f;
  --danger: #ff4757;
  --success: #d4a519;      /* gold */
  --success2: #e6b933;
  --success-soft: #3a2d0a;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text);
  font-size: inherit;
}
input {
  font-family: inherit;
  font-size: 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 12px;
  outline: none;
  width: 100%;
}
input:focus { border-color: var(--accent); }
input[type="number"] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button { -webkit-appearance: none; }
input:disabled {
  opacity: 0.6;
  background: var(--surface);
}

/* Nav */
.nav {
  display: flex;
  justify-content: space-around;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  z-index: 100;
}
.nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 16px;
  font-size: 11px;
  color: var(--text2);
  transition: color 0.2s;
}
.nav button.active { color: var(--accent2); }
.nav button svg { width: 24px; height: 24px; }

/* Pages */
.page { display: none; padding: 16px 16px 80px; max-width: 600px; margin: 0 auto; }
.page.active { display: block; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.page-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 18px; }

/* Home dashboard */
.today-hero {
  background: linear-gradient(135deg, var(--accent) 0%, #2b4596 100%);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.today-hero.done {
  background: linear-gradient(135deg, var(--success) 0%, #a8851a 100%);
  color: #1a1410;
}
.today-hero.rest {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}
.today-hero .hero-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.85;
  margin-bottom: 6px;
  font-weight: 600;
}
.today-hero .hero-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.today-hero .hero-meta {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 14px;
}
.today-hero .hero-btn {
  background: rgba(255,255,255,0.95);
  color: #1a1410;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 700;
  width: 100%;
  display: block;
  text-align: center;
}
.today-hero .hero-btn:active { background: rgba(255,255,255,0.8); }
.today-hero.rest .hero-btn { background: var(--surface2); color: var(--text); }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
}
.stat-num.gold { color: var(--success2); }
.stat-label {
  font-size: 12px;
  color: var(--text2);
  margin-top: 2px;
}
.stat-sub {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
}

.upcoming-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 14px;
  cursor: pointer;
}
.upcoming-card:active { border-color: var(--accent); }
.upcoming-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text2);
  font-weight: 600;
  margin-bottom: 6px;
}
.upcoming-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}
.upcoming-meta {
  font-size: 12px;
  color: var(--text2);
}
.section-heading {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 10px 0 8px;
}

/* Week navigation */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.week-nav-arrow {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 18px;
  color: var(--text);
}
.week-nav-arrow:active { background: var(--surface2); }
.week-nav-label {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
}
.week-nav-label .sub {
  font-size: 12px;
  color: var(--text2);
  font-weight: 400;
  display: block;
  margin-top: 2px;
}
.btn-today {
  font-size: 12px;
  color: var(--accent2);
  padding: 6px 10px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  margin-bottom: 12px;
}

/* Week view */
.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color 0.2s;
}
.day-card:active { border-color: var(--accent); }
.day-card.today { border-color: var(--accent2); }
.day-card.completed { border-color: var(--success); }
.day-name { font-weight: 600; font-size: 15px; }
.day-label { font-size: 13px; color: var(--text2); margin-top: 2px; }
.day-count { font-size: 12px; color: var(--text2); }
.day-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.day-status.done { background: var(--success); color: #000; }
.day-status.pending { background: var(--surface2); color: var(--text2); }
.arrow { color: var(--text2); font-size: 18px; }

/* Day detail */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent2);
  font-size: 14px;
  padding: 8px 0;
  margin-bottom: 8px;
}
.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.day-header h2 { font-size: 20px; font-weight: 700; }
.label-edit {
  font-size: 13px;
  color: var(--accent2);
  padding: 4px 8px;
}
.exercise-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: opacity 0.2s;
}
.exercise-card.skipped { opacity: 0.5; }
.exercise-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
}
.exercise-name { font-weight: 600; font-size: 15px; flex: 1; }
.exercise-name .skip-tag {
  font-size: 11px;
  color: var(--text2);
  font-weight: 500;
  margin-left: 6px;
}
.exercise-actions { display: flex; gap: 4px; align-items: center; }
.btn-skip {
  font-size: 12px;
  color: var(--text2);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.btn-skip:active { background: var(--surface2); }
.btn-skip.undo { color: var(--accent2); border-color: var(--accent); }
.btn-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 16px;
}
.btn-icon:active { background: var(--surface2); }
.exercise-body { padding: 0 16px 12px; }
.prev-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.prev-sets {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text2);
}
.set-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.set-num {
  font-size: 12px;
  color: var(--text2);
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.prev-weight-box {
  min-width: 42px;
  text-align: center;
  padding: 8px 6px;
  font-size: 13px;
  color: var(--text2);
  background: var(--surface2);
  border: 1px dashed var(--border);
  border-radius: 6px;
  flex-shrink: 0;
  font-weight: 500;
}
.prev-weight-box.empty { color: #555; }
.set-row input { width: 70px; text-align: center; padding: 8px 6px; }
.set-row .unit { font-size: 11px; color: var(--text2); flex-shrink: 0; }
.remove-set {
  color: var(--danger);
  font-size: 18px;
  padding: 4px;
  flex-shrink: 0;
  opacity: 0.6;
}
.btn-add-set {
  font-size: 13px;
  color: var(--accent2);
  padding: 8px 0;
}

/* Effort callout from last session */
.effort-callout {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 12px;
}
.effort-callout strong { color: var(--text); font-weight: 600; }
.effort-callout .callout-date { font-size: 11px; opacity: 0.7; }

/* Effort rating */
.effort-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.effort-label {
  font-size: 12px;
  color: var(--text2);
  margin-right: 4px;
}
.effort-btn {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--text2);
  background: var(--surface2);
  transition: all 0.15s;
}
.effort-btn:active { background: var(--surface); }
.effort-btn.selected {
  background: var(--success);
  border-color: var(--success);
  color: #000;
  font-weight: 600;
}

.add-exercise-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.add-exercise-row input { flex: 1; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.btn-primary:active { background: var(--accent2); }
.btn-success {
  background: var(--success);
  color: #000;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 700;
  width: 100%;
  margin-top: 16px;
}
.btn-success:active { background: var(--success2); }
.btn-outline {
  border: 1px solid var(--accent);
  color: var(--accent2);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  width: 100%;
  margin-top: 16px;
}
.btn-outline:active { background: var(--surface2); }
.btn-danger { color: var(--danger); }

/* Completed banner */
.completed-banner {
  background: var(--success);
  color: #000;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
}

/* Finish animation overlay */
.finish-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(10, 16, 32, 0.85);
  z-index: 300;
  pointer-events: none;
}
.finish-overlay.active {
  display: flex;
  animation: fadeOut 1.6s ease forwards;
}
.finish-check {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popIn 0.5s cubic-bezier(0.22, 1.36, 0.6, 1.2) forwards;
  box-shadow: 0 0 60px rgba(212, 165, 25, 0.6);
}
.finish-check svg {
  width: 60px;
  height: 60px;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawCheck 0.4s ease forwards 0.25s;
}
.confetti {
  position: absolute;
  width: 8px;
  height: 14px;
  top: 50%;
  left: 50%;
  pointer-events: none;
  opacity: 0;
  animation: confettiBurst 1.2s ease-out forwards 0.1s;
}
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes drawCheck {
  to { stroke-dashoffset: 0; }
}
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes confettiBurst {
  0% { transform: translate(0,0) rotate(0); opacity: 1; }
  100% { transform: translate(var(--cx), var(--cy)) rotate(var(--cr)); opacity: 0; }
}

/* Progress */
.chart-label {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 4px;
  text-align: center;
}
.progress-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.ps-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text2);
  padding: 4px 0;
}
.ps-row strong { color: var(--text); font-weight: 600; }
.ps-row.up strong { color: var(--success2); }
.ps-row.down strong { color: var(--danger); }

.history-entry {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.history-entry:last-child { border-bottom: none; }
.history-date { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.history-sets { font-size: 13px; }
.chart-container {
  height: 120px;
  position: relative;
  margin: 8px 0;
}
canvas { width: 100% !important; height: 100% !important; }

/* Edit plan */
.edit-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.edit-section .day-name { margin-bottom: 8px; }
.edit-label-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.edit-label-row input { flex: 1; }
.edit-exercise-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.edit-exercise-item:last-of-type { border-bottom: none; }
.edit-exercise-item button { color: var(--danger); font-size: 13px; padding: 4px 8px; }
.edit-exercise-info { flex: 1; min-width: 0; }
.edit-exercise-name { font-weight: 600; word-break: break-word; }
.edit-exercise-targets {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  align-items: center;
}
.edit-exercise-targets input {
  width: 56px;
  text-align: center;
  padding: 6px 4px;
  font-size: 14px;
}
.edit-exercise-targets .target-label {
  font-size: 12px;
  color: var(--text2);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 360px;
}
.modal h3 { margin-bottom: 12px; font-size: 17px; }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.modal-actions button { padding: 8px 16px; border-radius: 8px; font-size: 14px; }
.btn-cancel { color: var(--text2); }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }

/* Select dropdown for progress */
select {
  font-family: inherit;
  font-size: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  outline: none;
  width: 100%;
  margin-bottom: 12px;
}
</style>
</head>
<body>

<div id="page-home" class="page active">
  <h1 class="page-title" id="home-greeting">Hello</h1>
  <div class="page-subtitle" id="home-date"></div>
  <div id="home-today-hero"></div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num gold" id="home-streak">0</div>
      <div class="stat-label">Day Streak</div>
      <div class="stat-sub" id="home-streak-sub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="home-week-progress">0/0</div>
      <div class="stat-label">This Week</div>
      <div class="stat-sub" id="home-week-sub"></div>
    </div>
  </div>
  <div id="home-upcoming"></div>
</div>

<div id="page-week" class="page">
  <h1 class="page-title">Workouts</h1>
  <div class="week-nav">
    <button class="week-nav-arrow" onclick="changeWeek(-1)">&#8249;</button>
    <div class="week-nav-label" id="week-nav-label"></div>
    <button class="week-nav-arrow" onclick="changeWeek(1)">&#8250;</button>
  </div>
  <button id="btn-today" class="btn-today" style="display:none" onclick="goToCurrentWeek()">Jump to This Week</button>
  <div id="week-list"></div>
</div>

<div id="page-day" class="page">
  <button class="back-btn" onclick="showPage('week')">&#8592; Back</button>
  <div class="day-header">
    <h2 id="day-title"></h2>
    <button class="label-edit" onclick="editDayLabel()">Edit Label</button>
  </div>
  <div id="day-completed-banner"></div>
  <div id="day-exercises"></div>
  <div id="day-actions"></div>
</div>

<div id="page-progress" class="page">
  <h1 class="page-title">Progress</h1>
  <select id="progress-exercise-select" onchange="renderProgress()"></select>
  <div id="progress-content"></div>
</div>

<div id="page-plan" class="page">
  <h1 class="page-title">Edit Plan</h1>
  <div id="plan-list"></div>
</div>

<nav class="nav">
  <button class="active" onclick="showPage('home')" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
    Home
  </button>
  <button onclick="showPage('week')" data-page="week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="4" x2="9" y2="2"/><line x1="15" y1="4" x2="15" y2="2"/></svg>
    Week
  </button>
  <button onclick="showPage('progress')" data-page="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
    Progress
  </button>
  <button onclick="showPage('plan')" data-page="plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Plan
  </button>
</nav>

<!-- Finish animation overlay -->
<div class="finish-overlay" id="finish-overlay">
  <div class="finish-check">
    <svg viewBox="0 0 50 50" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="12,26 22,36 38,16" />
    </svg>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <input id="modal-input" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-confirm">Save</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DEFAULT_SETS = 4;
const DEFAULT_REPS = 8;

// ---- Data Layer ----
function getWeekPlan() {
  const saved = localStorage.getItem('wt_plan');
  if (saved) {
    const plan = JSON.parse(saved);
    let needsSave = false;
    plan.forEach(d => {
      d.exercises = d.exercises.map(ex => {
        if (typeof ex === 'string') {
          needsSave = true;
          return { name: ex, targetSets: DEFAULT_SETS, targetReps: DEFAULT_REPS };
        }
        return ex;
      });
    });
    if (needsSave) savePlan(plan);
    return plan;
  }
  const plan = DAYS.map(d => ({ day: d, label: '', exercises: [] }));
  savePlan(plan);
  return plan;
}
function savePlan(plan) { localStorage.setItem('wt_plan', JSON.stringify(plan)); }

function getLogs() {
  const saved = localStorage.getItem('wt_logs');
  return saved ? JSON.parse(saved) : {};
}
function saveLogs(logs) { localStorage.setItem('wt_logs', JSON.stringify(logs)); }

function getDateKey(date) {
  const d = date || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getTodayDayIndex() {
  const jsDay = new Date().getDay();
  return jsDay === 0 ? 6 : jsDay - 1;
}

function getDayLog(dayIndex, dateKey) {
  const logs = getLogs();
  const key = dateKey || getDateKey();
  return logs[key] && logs[key][dayIndex] ? logs[key][dayIndex] : {};
}

function saveDayLog(dayIndex, exerciseLogs, dateKey) {
  const logs = getLogs();
  const key = dateKey || getDateKey();
  if (!logs[key]) logs[key] = {};
  logs[key][dayIndex] = exerciseLogs;
  saveLogs(logs);
}

function isCompleted(dayIndex, dateKey) {
  const log = getDayLog(dayIndex, dateKey);
  return log._completed === true;
}

function setCompleted(dayIndex, completed, dateKey) {
  const key = dateKey || getDateKey();
  const log = getDayLog(dayIndex, key);
  log._completed = completed;
  saveDayLog(dayIndex, log, key);
}

// Find the previous logged session for an exercise (before given date)
function getLastLog(dayIndex, exerciseName, beforeDate) {
  const logs = getLogs();
  const cutoff = beforeDate || getDateKey();
  const dates = Object.keys(logs).filter(d => d < cutoff).sort().reverse();
  for (const date of dates) {
    if (logs[date] && logs[date][dayIndex]) {
      const ex = logs[date][dayIndex][exerciseName];
      if (ex && Array.isArray(ex) && ex.length > 0) {
        // Only return if it actually has values
        const hasData = ex.some(s => s.weight || s.reps);
        if (hasData) return { date, sets: ex };
      }
    }
  }
  return null;
}

// Get previous weight for a specific set index
function getPrevWeight(dayIndex, exerciseName, setIdx, beforeDate) {
  const prev = getLastLog(dayIndex, exerciseName, beforeDate);
  if (!prev) return '';
  if (prev.sets[setIdx] && prev.sets[setIdx].weight) return prev.sets[setIdx].weight;
  // Fall back to last set's weight if asked for a higher set number
  for (let i = prev.sets.length - 1; i >= 0; i--) {
    if (prev.sets[i].weight) return prev.sets[i].weight;
  }
  return '';
}

// Get previous effort rating for an exercise
function getLastEffort(dayIndex, exerciseName, beforeDate) {
  const logs = getLogs();
  const cutoff = beforeDate || getDateKey();
  const dates = Object.keys(logs).filter(d => d < cutoff).sort().reverse();
  for (const date of dates) {
    if (logs[date] && logs[date][dayIndex]) {
      const eff = logs[date][dayIndex]['_effort_' + exerciseName];
      if (eff) return { effort: eff, date };
    }
  }
  return null;
}

// Compute total volume for a session: sum of weight * reps
function computeVolume(sets) {
  return sets.reduce((sum, s) => sum + (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0), 0);
}

// Streak: consecutive days with completed workouts, skipping rest days
function getStreak() {
  const plan = getWeekPlan();
  let streak = 0;
  const d = new Date();
  const todayKey = getDateKey();
  for (let i = 0; i < 365; i++) {
    const dayIdx = (d.getDay() === 0 ? 6 : d.getDay() - 1);
    const day = plan[dayIdx];
    const dateKey = getDateKey(d);
    if (day.exercises.length === 0) {
      // Rest day: skip, doesn't affect streak
      d.setDate(d.getDate() - 1);
      continue;
    }
    if (isCompleted(dayIdx, dateKey)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (dateKey === todayKey) {
      // Today not done yet — don't break the streak
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// This week's stats: completed / total scheduled (with exercises)
function getThisWeekStats() {
  const plan = getWeekPlan();
  const weekKeys = getWeekDateKeys(0);
  let scheduled = 0, completed = 0;
  plan.forEach((d, i) => {
    if (d.exercises.length > 0) {
      scheduled++;
      if (isCompleted(i, weekKeys[i])) completed++;
    }
  });
  return { scheduled, completed };
}

// Find the next upcoming workout day after today
function getUpcomingWorkout() {
  const plan = getWeekPlan();
  const todayIdx = getTodayDayIndex();
  for (let offset = 1; offset <= 7; offset++) {
    const idx = (todayIdx + offset) % 7;
    if (plan[idx].exercises.length > 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return { dayIndex: idx, day: plan[idx], dateKey: getDateKey(d), daysAway: offset };
    }
  }
  return null;
}

// Sync the day's log with current plan (preload missing sets with prev weights)
function syncDayWithPlan(dayIndex, dateKey) {
  const key = dateKey || getDateKey();
  const plan = getWeekPlan();
  const day = plan[dayIndex];
  const log = getDayLog(dayIndex, key);
  let changed = false;
  day.exercises.forEach(ex => {
    const name = ex.name;
    const targetSets = ex.targetSets || DEFAULT_SETS;
    const targetReps = ex.targetReps || DEFAULT_REPS;
    if (!log[name] || !Array.isArray(log[name])) {
      log[name] = [];
      changed = true;
    }
    while (log[name].length < targetSets) {
      const i = log[name].length;
      const prevW = getPrevWeight(dayIndex, name, i, key);
      log[name].push({ weight: prevW || '', reps: targetReps });
      changed = true;
    }
  });
  if (changed) saveDayLog(dayIndex, log, key);
  return log;
}

// ---- State ----
let currentDay = null;
let currentDate = null;       // date key being viewed in day view
let currentPage = 'week';
let weekOffset = 0;            // 0 = current week, -1 last week, etc.
let expandedExercises = new Set();

// ---- Navigation ----
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  if (page === 'home') renderHome();
  if (page === 'week') { currentDay = null; currentDate = null; renderWeek(); }
  if (page === 'progress') renderProgressSelect();
  if (page === 'plan') renderPlan();
}

function openDay(dayIndex, dateKey) {
  currentDay = dayIndex;
  currentDate = dateKey || getDateKey();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-day').classList.add('active');
  expandedExercises = new Set();
  const plan = getWeekPlan();
  if (plan[dayIndex].exercises.length > 0) {
    syncDayWithPlan(dayIndex, currentDate);
    plan[dayIndex].exercises.forEach((_, i) => expandedExercises.add(i));
  }
  renderDay();
}

function changeWeek(delta) {
  weekOffset += delta;
  renderWeek();
}

function goToCurrentWeek() {
  weekOffset = 0;
  renderWeek();
}

// ---- Render: Home ----
function renderHome() {
  const now = new Date();
  const hour = now.getHours();
  let greeting;
  if (hour < 5) greeting = 'Up Late';
  else if (hour < 12) greeting = 'Good Morning';
  else if (hour < 17) greeting = 'Good Afternoon';
  else greeting = 'Good Evening';
  document.getElementById('home-greeting').textContent = greeting;
  document.getElementById('home-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  const plan = getWeekPlan();
  const todayIdx = getTodayDayIndex();
  const today = plan[todayIdx];
  const todayKey = getDateKey();
  const todayDone = isCompleted(todayIdx, todayKey);

  // Today hero
  const heroEl = document.getElementById('home-today-hero');
  if (today.exercises.length === 0) {
    heroEl.innerHTML = `
      <div class="today-hero rest">
        <div class="hero-label">Today</div>
        <div class="hero-name">${today.day}${today.label ? ' — ' + today.label : ' — Rest Day'}</div>
        <div class="hero-meta">No workout scheduled. Enjoy the recovery.</div>
      </div>
    `;
  } else {
    // Count logged exercises so far
    const log = getDayLog(todayIdx, todayKey);
    let loggedCount = 0;
    today.exercises.forEach(ex => {
      if (Array.isArray(log[ex.name]) && log[ex.name].some(s => s.weight || s.reps)) loggedCount++;
    });
    let metaText, btnText;
    if (todayDone) {
      metaText = `${today.exercises.length} exercise${today.exercises.length !== 1 ? 's' : ''} · Complete`;
      btnText = 'Review Workout';
    } else if (loggedCount > 0) {
      metaText = `${today.exercises.length} exercise${today.exercises.length !== 1 ? 's' : ''} · In progress`;
      btnText = 'Continue Workout';
    } else {
      metaText = `${today.exercises.length} exercise${today.exercises.length !== 1 ? 's' : ''} · Ready to start`;
      btnText = 'Start Workout';
    }
    heroEl.innerHTML = `
      <div class="today-hero ${todayDone ? 'done' : ''}">
        <div class="hero-label">Today's Workout</div>
        <div class="hero-name">${today.label || today.day}</div>
        <div class="hero-meta">${metaText}</div>
        <button class="hero-btn" onclick="openDay(${todayIdx}, '${todayKey}')">${btnText}</button>
      </div>
    `;
  }

  // Streak
  const streak = getStreak();
  document.getElementById('home-streak').textContent = streak;
  document.getElementById('home-streak-sub').textContent = streak === 0 ? "Let's get started" : (streak === 1 ? 'workout day' : 'workout days');

  // This week
  const wk = getThisWeekStats();
  document.getElementById('home-week-progress').textContent = wk.completed + '/' + wk.scheduled;
  document.getElementById('home-week-sub').textContent = (wk.scheduled === 0 ? 'No workouts planned' : (wk.completed === wk.scheduled ? 'All done!' : 'workouts completed'));

  // Upcoming
  const upcoming = getUpcomingWorkout();
  const upcomingEl = document.getElementById('home-upcoming');
  if (upcoming) {
    const dayName = upcoming.daysAway === 1 ? 'Tomorrow' : upcoming.day.day;
    upcomingEl.innerHTML = `
      <div class="upcoming-card" onclick="openDay(${upcoming.dayIndex}, '${upcoming.dateKey}')">
        <div class="upcoming-label">Coming Up</div>
        <div class="upcoming-name">${dayName}${upcoming.day.label ? ' — ' + upcoming.day.label : ''}</div>
        <div class="upcoming-meta">${upcoming.day.exercises.length} exercise${upcoming.day.exercises.length !== 1 ? 's' : ''}</div>
      </div>
    `;
  } else {
    upcomingEl.innerHTML = '';
  }
}

// ---- Render: Week ----
function getWeekDateKeys(offset) {
  const today = new Date();
  const todayIdx = getTodayDayIndex();
  return DAYS.map((_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() + (i - todayIdx) + (offset * 7));
    return getDateKey(d);
  });
}

function getWeekDisplayDates(offset) {
  const today = new Date();
  const todayIdx = getTodayDayIndex();
  return DAYS.map((_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() + (i - todayIdx) + (offset * 7));
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  });
}

function renderWeek() {
  const plan = getWeekPlan();
  const todayIdx = getTodayDayIndex();
  const weekDateKeys = getWeekDateKeys(weekOffset);
  const weekDisplayDates = getWeekDisplayDates(weekOffset);
  const todayKey = getDateKey();

  // Week navigation label
  const firstDate = weekDisplayDates[0];
  const lastDate = weekDisplayDates[6];
  let weekLabel;
  if (weekOffset === 0) weekLabel = 'This Week';
  else if (weekOffset === -1) weekLabel = 'Last Week';
  else if (weekOffset === 1) weekLabel = 'Next Week';
  else weekLabel = (weekOffset < 0 ? Math.abs(weekOffset) + ' weeks ago' : weekOffset + ' weeks ahead');
  document.getElementById('week-nav-label').innerHTML = weekLabel + '<span class="sub">' + firstDate + ' &ndash; ' + lastDate + '</span>';

  document.getElementById('btn-today').style.display = (weekOffset === 0 ? 'none' : 'inline-block');

  const list = document.getElementById('week-list');
  list.innerHTML = plan.map((d, i) => {
    const dateKey = weekDateKeys[i];
    const isToday = (weekOffset === 0 && i === todayIdx);
    const done = isCompleted(i, dateKey);
    const hasExercises = d.exercises.length > 0;
    const cardClass = done ? 'completed' : (isToday ? 'today' : '');
    let statusHtml = '';
    if (hasExercises) {
      if (done) statusHtml = '<span class="day-status done">Done</span>';
      else if (dateKey <= todayKey) statusHtml = '<span class="day-status pending">Pending</span>';
    }
    return `
      <div class="day-card ${cardClass}" onclick="openDay(${i}, '${dateKey}')">
        <div>
          <div class="day-name">${d.day}${isToday ? ' (Today)' : ''} <span style="font-weight:400;color:var(--text2);font-size:13px">${weekDisplayDates[i]}</span></div>
          <div class="day-label">${d.label || 'No label'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${statusHtml}
          <span class="day-count">${d.exercises.length} exercise${d.exercises.length !== 1 ? 's' : ''}</span>
          <span class="arrow">&#8250;</span>
        </div>
      </div>
    `;
  }).join('');
}

// ---- Render: Day Detail ----
function renderDay() {
  const plan = getWeekPlan();
  const day = plan[currentDay];
  const dateKey = currentDate;
  const log = getDayLog(currentDay, dateKey);
  const completed = log._completed === true;

  const viewedDate = new Date(dateKey + 'T00:00:00');
  const dateStr = viewedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  document.getElementById('day-title').innerHTML = day.day + (day.label ? ' — ' + day.label : '') + '<div style="font-size:13px;color:var(--text2);font-weight:400;margin-top:2px">' + dateStr + '</div>';

  const bannerEl = document.getElementById('day-completed-banner');
  bannerEl.innerHTML = completed ? '<div class="completed-banner">Workout Complete</div>' : '';

  const container = document.getElementById('day-exercises');
  if (day.exercises.length === 0) {
    container.innerHTML = '<div class="empty">No exercises yet. Go to the Plan tab to add exercises.</div>';
    document.getElementById('day-actions').innerHTML = '';
    return;
  }

  container.innerHTML = day.exercises.map((ex, idx) => {
    const name = ex.name;
    const exLog = log[name];
    const isOpen = expandedExercises.has(idx);
    const skipped = exLog && exLog._skipped;
    const sets = (exLog && Array.isArray(exLog)) ? exLog : (exLog && Array.isArray(exLog.sets) ? exLog.sets : []);
    // Note: log[name] is normally an array. Effort/skipped are stored as separate keys.
    const effortKey = '_effort_' + name;
    const skippedKey = '_skipped_' + name;
    const currentEffort = log[effortKey];
    const isSkipped = log[skippedKey] === true;
    const prevLog = getLastLog(currentDay, name, dateKey);

    let body = '';
    if (isOpen && !isSkipped) {
      let prevHtml = '';
      const prevEffort = getLastEffort(currentDay, name, dateKey);
      if (prevEffort) {
        const labels = { lower: 'Lower', stay: 'Stay Here', progress: 'Progress' };
        const icons = { lower: '&darr;', stay: '&rarr;', progress: '&uarr;' };
        prevHtml = `<div class="effort-callout">${icons[prevEffort.effort]} Last week: <strong>${labels[prevEffort.effort]}</strong> <span class="callout-date">(${formatDate(prevEffort.date)})</span></div>`;
      } else if (!prevLog) {
        prevHtml = '<div class="prev-label">No previous data</div>';
      }

      const disabled = completed ? 'disabled' : '';
      const setsHtml = sets.map((s, si) => {
        const prevW = getPrevWeight(currentDay, name, si, dateKey);
        const prevDisplay = prevW ? prevW : '—';
        const prevClass = prevW ? '' : 'empty';
        const removeBtn = (completed || sets.length <= 1) ? '' : `<button class="remove-set" onclick="removeSet(${idx},'${esc(name)}',${si})">&#215;</button>`;
        return `
          <div class="set-row">
            <span class="set-num">${si+1}</span>
            <span class="prev-weight-box ${prevClass}" title="Last time">${prevDisplay}</span>
            <input type="number" inputmode="decimal" placeholder="lbs" value="${s.weight || ''}" ${disabled} onchange="updateSet(${idx},'${esc(name)}',${si},'weight',this.value)" />
            <span class="unit">lbs</span>
            <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps || ''}" ${disabled} onchange="updateSet(${idx},'${esc(name)}',${si},'reps',this.value)" />
            <span class="unit">reps</span>
            ${removeBtn}
          </div>
        `;
      }).join('');

      const addBtn = completed ? '' : `<button class="btn-add-set" onclick="addSet(${idx},'${esc(name)}')">+ Add Set</button>`;

      const effortHtml = `
        <div class="effort-row">
          <span class="effort-label">Effort:</span>
          <button class="effort-btn ${currentEffort === 'lower' ? 'selected' : ''}" ${disabled} onclick="setEffort('${esc(name)}','lower')">Lower</button>
          <button class="effort-btn ${currentEffort === 'stay' ? 'selected' : ''}" ${disabled} onclick="setEffort('${esc(name)}','stay')">Stay Here</button>
          <button class="effort-btn ${currentEffort === 'progress' ? 'selected' : ''}" ${disabled} onclick="setEffort('${esc(name)}','progress')">Progress</button>
        </div>
      `;

      body = `<div class="exercise-body">${prevHtml}${setsHtml}${addBtn}${effortHtml}</div>`;
    }

    const skipBtn = completed
      ? ''
      : (isSkipped
          ? `<button class="btn-skip undo" onclick="event.stopPropagation();toggleSkip('${esc(name)}')">Undo Skip</button>`
          : `<button class="btn-skip" onclick="event.stopPropagation();toggleSkip('${esc(name)}')">Skip</button>`);

    const setsLabel = isSkipped ? '' : `<span style="font-size:13px;color:var(--text2)">${sets.length} set${sets.length !== 1 ? 's' : ''}</span>`;

    return `
      <div class="exercise-card ${isSkipped ? 'skipped' : ''}">
        <div class="exercise-header" onclick="toggleExercise(${idx})">
          <span class="exercise-name">${name}${isSkipped ? '<span class="skip-tag">(skipped)</span>' : ''}</span>
          <div class="exercise-actions">
            ${setsLabel}
            ${skipBtn}
          </div>
        </div>
        ${body}
      </div>
    `;
  }).join('');

  const actionsEl = document.getElementById('day-actions');
  if (completed) {
    actionsEl.innerHTML = '<button class="btn-outline" onclick="editWorkout()">Edit Workout</button>';
  } else {
    actionsEl.innerHTML = '<button class="btn-success" onclick="finishWorkout()">Finish Workout</button>';
  }
}

function finishWorkout() {
  setCompleted(currentDay, true, currentDate);
  playFinishAnimation();
  renderDay();
}

function editWorkout() {
  setCompleted(currentDay, false, currentDate);
  renderDay();
}

function playFinishAnimation() {
  const overlay = document.getElementById('finish-overlay');
  // Clear old confetti
  overlay.querySelectorAll('.confetti').forEach(c => c.remove());

  // Add confetti pieces
  const colors = ['#d4a519', '#3b5dc9', '#e6b933', '#5577e0', '#ffd75e'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    const angle = (i / 24) * Math.PI * 2;
    const dist = 120 + Math.random() * 100;
    c.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
    c.style.setProperty('--cy', Math.sin(angle) * dist + 'px');
    c.style.setProperty('--cr', (Math.random() * 720 - 360) + 'deg');
    c.style.animationDelay = (Math.random() * 0.15) + 's';
    overlay.appendChild(c);
  }

  overlay.classList.remove('active');
  // Force reflow so animation restarts
  void overlay.offsetWidth;
  overlay.classList.add('active');

  setTimeout(() => {
    overlay.classList.remove('active');
  }, 1700);
}

function esc(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function formatDate(d) {
  const parts = d.split('-');
  return parseInt(parts[1]) + '/' + parseInt(parts[2]);
}

function toggleExercise(idx) {
  if (expandedExercises.has(idx)) expandedExercises.delete(idx);
  else expandedExercises.add(idx);
  renderDay();
}

function toggleSkip(exerciseName) {
  const log = getDayLog(currentDay, currentDate);
  const key = '_skipped_' + exerciseName;
  log[key] = !log[key];
  saveDayLog(currentDay, log, currentDate);
  renderDay();
}

function setEffort(exerciseName, value) {
  const log = getDayLog(currentDay, currentDate);
  const key = '_effort_' + exerciseName;
  // Toggle off if already selected
  if (log[key] === value) delete log[key];
  else log[key] = value;
  saveDayLog(currentDay, log, currentDate);
  renderDay();
}

function addSet(idx, exerciseName) {
  const log = getDayLog(currentDay, currentDate);
  if (!Array.isArray(log[exerciseName])) log[exerciseName] = [];
  const plan = getWeekPlan();
  const ex = plan[currentDay].exercises[idx];
  const targetReps = ex ? ex.targetReps : DEFAULT_REPS;
  log[exerciseName].push({ weight: '', reps: targetReps });
  saveDayLog(currentDay, log, currentDate);
  renderDay();
}

function removeSet(idx, exerciseName, setIdx) {
  const log = getDayLog(currentDay, currentDate);
  if (Array.isArray(log[exerciseName])) {
    log[exerciseName].splice(setIdx, 1);
    saveDayLog(currentDay, log, currentDate);
    renderDay();
  }
}

function updateSet(idx, exerciseName, setIdx, field, value) {
  const log = getDayLog(currentDay, currentDate);
  if (!Array.isArray(log[exerciseName])) log[exerciseName] = [];
  if (!log[exerciseName][setIdx]) log[exerciseName][setIdx] = { weight: '', reps: '' };
  log[exerciseName][setIdx][field] = value;
  saveDayLog(currentDay, log, currentDate);
}

// ---- Day Label ----
function editDayLabel() {
  const plan = getWeekPlan();
  openModal('Day Label', plan[currentDay].label, (val) => {
    plan[currentDay].label = val.trim();
    savePlan(plan);
    renderDay();
  });
}

// ---- Render: Plan ----
function renderPlan() {
  const plan = getWeekPlan();
  document.getElementById('plan-list').innerHTML = plan.map((d, i) => `
    <div class="edit-section">
      <div class="day-name">${d.day}</div>
      <div class="edit-label-row">
        <input value="${d.label}" placeholder="Label (e.g. Chest, Rest)" onchange="updateLabel(${i}, this.value)" />
      </div>
      ${d.exercises.map((ex, ei) => `
        <div class="edit-exercise-item">
          <div class="edit-exercise-info">
            <div class="edit-exercise-name">${ex.name}</div>
            <div class="edit-exercise-targets">
              <input type="number" inputmode="numeric" value="${ex.targetSets}" onchange="updateTarget(${i},${ei},'targetSets',this.value)" />
              <span class="target-label">sets</span>
              <input type="number" inputmode="numeric" value="${ex.targetReps}" onchange="updateTarget(${i},${ei},'targetReps',this.value)" />
              <span class="target-label">reps</span>
            </div>
          </div>
          <div>
            <button onclick="planRenameExercise(${i},${ei})">Rename</button>
            <button onclick="planRemoveExercise(${i},${ei})">Remove</button>
          </div>
        </div>
      `).join('')}
      <div class="add-exercise-row" style="margin-top:8px">
        <input id="plan-add-${i}" placeholder="Add exercise" />
        <button class="btn-primary" onclick="planAddExercise(${i})">Add</button>
      </div>
    </div>
  `).join('');
}

function updateLabel(dayIdx, val) {
  const plan = getWeekPlan();
  plan[dayIdx].label = val.trim();
  savePlan(plan);
}

function updateTarget(dayIdx, exIdx, field, value) {
  const plan = getWeekPlan();
  plan[dayIdx].exercises[exIdx][field] = parseInt(value) || 1;
  savePlan(plan);
}

function planAddExercise(dayIdx) {
  const input = document.getElementById('plan-add-' + dayIdx);
  const name = input.value.trim();
  if (!name) return;
  const plan = getWeekPlan();
  plan[dayIdx].exercises.push({ name, targetSets: DEFAULT_SETS, targetReps: DEFAULT_REPS });
  savePlan(plan);
  input.value = '';
  renderPlan();
}

function planRemoveExercise(dayIdx, exIdx) {
  const plan = getWeekPlan();
  plan[dayIdx].exercises.splice(exIdx, 1);
  savePlan(plan);
  renderPlan();
}

function planRenameExercise(dayIdx, exIdx) {
  const plan = getWeekPlan();
  const oldName = plan[dayIdx].exercises[exIdx].name;
  openModal('Rename Exercise', oldName, (newName) => {
    if (!newName.trim()) return;
    plan[dayIdx].exercises[exIdx].name = newName.trim();
    savePlan(plan);
    const logs = getLogs();
    for (const date in logs) {
      if (logs[date][dayIdx] && logs[date][dayIdx][oldName]) {
        logs[date][dayIdx][newName.trim()] = logs[date][dayIdx][oldName];
        delete logs[date][dayIdx][oldName];
      }
      // migrate effort/skipped keys too
      const oldEffort = '_effort_' + oldName;
      const newEffort = '_effort_' + newName.trim();
      if (logs[date][dayIdx] && logs[date][dayIdx][oldEffort] !== undefined) {
        logs[date][dayIdx][newEffort] = logs[date][dayIdx][oldEffort];
        delete logs[date][dayIdx][oldEffort];
      }
      const oldSkipped = '_skipped_' + oldName;
      const newSkipped = '_skipped_' + newName.trim();
      if (logs[date][dayIdx] && logs[date][dayIdx][oldSkipped] !== undefined) {
        logs[date][dayIdx][newSkipped] = logs[date][dayIdx][oldSkipped];
        delete logs[date][dayIdx][oldSkipped];
      }
    }
    saveLogs(logs);
    renderPlan();
  });
}

// ---- Render: Progress ----
function renderProgressSelect() {
  const plan = getWeekPlan();
  const exerciseSet = new Set();
  plan.forEach(d => d.exercises.forEach(ex => exerciseSet.add(ex.name)));
  const exercises = [...exerciseSet].sort();

  const select = document.getElementById('progress-exercise-select');
  if (exercises.length === 0) {
    select.innerHTML = '<option>No exercises yet</option>';
    document.getElementById('progress-content').innerHTML = '<div class="empty">Add exercises to your weekly plan to track progress.</div>';
    return;
  }

  const currentVal = select.value;
  select.innerHTML = exercises.map(ex => `<option value="${ex}" ${ex === currentVal ? 'selected' : ''}>${ex}</option>`).join('');
  if (!currentVal || !exercises.includes(currentVal)) select.value = exercises[0];
  renderProgress();
}

function renderProgress() {
  const exerciseName = document.getElementById('progress-exercise-select').value;
  if (!exerciseName) return;

  const logs = getLogs();
  const plan = getWeekPlan();
  const entries = [];

  const dayIndices = [];
  plan.forEach((d, i) => { if (d.exercises.some(ex => ex.name === exerciseName)) dayIndices.push(i); });

  const dates = Object.keys(logs).sort();
  for (const date of dates) {
    for (const di of dayIndices) {
      if (logs[date] && logs[date][di] && Array.isArray(logs[date][di][exerciseName])) {
        const sets = logs[date][di][exerciseName].filter(s => s.weight || s.reps);
        if (sets.length > 0) entries.push({ date, sets });
      }
    }
  }

  const content = document.getElementById('progress-content');
  if (entries.length === 0) {
    content.innerHTML = '<div class="empty">No logged data for this exercise yet.</div>';
    return;
  }

  const chartData = entries.map(e => ({
    date: e.date,
    volume: e.sets.reduce((sum, s) => sum + (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0), 0)
  }));

  // Latest vs previous volume comparison
  let summaryHtml = '';
  if (chartData.length >= 2) {
    const latest = chartData[chartData.length - 1].volume;
    const prev = chartData[chartData.length - 2].volume;
    const diff = latest - prev;
    const pct = prev > 0 ? Math.round((diff / prev) * 100) : 0;
    const arrow = diff > 0 ? '&uarr;' : (diff < 0 ? '&darr;' : '&rarr;');
    const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
    summaryHtml = `<div class="progress-summary"><div class="ps-row"><span>Total volume (latest)</span><strong>${Math.round(latest).toLocaleString()} lbs</strong></div><div class="ps-row ${cls}"><span>vs. previous session</span><strong>${arrow} ${diff >= 0 ? '+' : ''}${Math.round(diff).toLocaleString()} lbs (${pct >= 0 ? '+' : ''}${pct}%)</strong></div></div>`;
  } else if (chartData.length === 1) {
    summaryHtml = `<div class="progress-summary"><div class="ps-row"><span>Total volume</span><strong>${Math.round(chartData[0].volume).toLocaleString()} lbs</strong></div></div>`;
  }

  let html = `<div class="chart-label">Total volume per session (lbs × reps)</div><div class="chart-container"><canvas id="progress-chart"></canvas></div>${summaryHtml}`;

  html += entries.slice().reverse().map(e => {
    const vol = e.sets.reduce((sum, s) => sum + (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0), 0);
    return `
    <div class="history-entry">
      <div class="history-date">${formatDateFull(e.date)} &middot; <span style="color:var(--text)">${Math.round(vol).toLocaleString()} lbs total</span></div>
      <div class="history-sets">${e.sets.map((s, i) => `Set ${i+1}: ${s.weight || 0}lbs x ${s.reps || 0}`).join(' &nbsp;|&nbsp; ')}</div>
    </div>
  `;
  }).join('');

  content.innerHTML = html;
  drawChart(chartData);
}

function formatDateFull(d) {
  const parts = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(parts[1])-1] + ' ' + parseInt(parts[2]) + ', ' + parts[0];
}

function drawChart(data) {
  const canvas = document.getElementById('progress-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const pad = { top: 10, right: 10, bottom: 24, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const weights = data.map(d => d.volume);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);
  const range = maxW - minW || 1;

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = '#2a3a5a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = '#8a9ab5';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(minW + range * i / 4), pad.left - 4, y + 3);
  }

  if (data.length === 1) {
    const x = pad.left + cw / 2;
    const y = pad.top + ch / 2;
    ctx.fillStyle = '#3b5dc9';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  ctx.strokeStyle = '#3b5dc9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = pad.left + (cw * i / (data.length - 1));
    const y = pad.top + ch - (ch * (d.volume - minW) / range);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  data.forEach((d, i) => {
    const x = pad.left + (cw * i / (data.length - 1));
    const y = pad.top + ch - (ch * (d.volume - minW) / range);
    ctx.fillStyle = '#3b5dc9';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#8a9ab5';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'start';
  ctx.fillText(formatDate(data[0].date), pad.left, h - 4);
  ctx.textAlign = 'end';
  ctx.fillText(formatDate(data[data.length-1].date), w - pad.right, h - 4);
}

// ---- Modal ----
function openModal(title, value, callback) {
  document.getElementById('modal-title').textContent = title;
  const input = document.getElementById('modal-input');
  input.value = value || '';
  document.getElementById('modal').classList.add('active');
  setTimeout(() => input.focus(), 100);

  const confirmBtn = document.getElementById('modal-confirm');
  const newBtn = confirmBtn.cloneNode(true);
  confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
  newBtn.id = 'modal-confirm';
  newBtn.addEventListener('click', () => {
    callback(input.value);
    closeModal();
  });

  input.onkeydown = (e) => {
    if (e.key === 'Enter') { callback(input.value); closeModal(); }
  };
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// ---- Init ----
renderHome();

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
